<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>第卅者 — 匿名情緒社交</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #16161a; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    #root { width: 100vw; height: 100vh; }
    /* Stage */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(120, 130, 180, 0.18), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(180, 140, 160, 0.12), transparent 50%),
        #0e0f14;
      overflow: hidden;
    }
    /* Scale wrapper — fits 402×874 device into any viewport, leaving room for chrome */
    .scaler {
      width: 402px; height: 874px;
      transform-origin: center center;
      transition: transform 0.3s ease;
    }
    .stage::before {
      content: '';
      position: absolute; inset: -20%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.02), transparent 40%);
      pointer-events: none;
    }
    /* Screen jumper */
    .jumper {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; align-items: center;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.1);
      padding: 6px; border-radius: 999px;
      z-index: 100;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .jumper button {
      background: transparent; border: none;
      color: rgba(255,255,255,0.45);
      padding: 8px 14px; border-radius: 999px;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .jumper button:hover { color: rgba(255,255,255,0.85); }
    .jumper button.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .jumper .sep { width: 1px; height: 14px; background: rgba(255,255,255,0.08); margin: 0 2px; }

    /* Direction label */
    .direction-label {
      position: fixed; top: 24px; left: 24px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      z-index: 100;
    }
    .direction-label b { color: rgba(255,255,255,0.75); font-weight: 500; }

    /* device wrapper allows palette-aware backdrop glow + viewport scale */
    .device-wrap {
      position: relative;
      transform: scale(var(--device-scale, 1));
      transform-origin: center;
      transition: transform 0.25s ease;
    }
    .device-wrap::after {
      content: '';
      position: absolute; inset: -80px;
      border-radius: 120px;
      background: var(--glow, radial-gradient(circle, rgba(180,150,200,0.18), transparent 60%));
      filter: blur(40px);
      z-index: -1;
      pointer-events: none;
    }


  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Fit device to viewport (390 × 844 phone + chrome)
    function fitDevice() {
      const wantW = 390 + 120;
      const wantH = 844 + 180;
      const sx = window.innerWidth / wantW;
      const sy = window.innerHeight / wantH;
      const s = Math.min(1, sx, sy);
      document.documentElement.style.setProperty('--device-scale', s.toFixed(3));
    }
    window.addEventListener('resize', fitDevice);
    window.addEventListener('load', fitDevice);
    fitDevice();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
